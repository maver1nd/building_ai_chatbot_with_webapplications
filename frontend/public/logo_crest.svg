<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-dasharray="2 1.5" />
  
  <!-- Inner Ring -->
  <circle cx="50" cy="50" r="28" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  <circle cx="50" cy="50" r="25" fill="#15295c" />
  
  <!-- Central Star -->
  <polygon points="50,28 53,38 63,38 55,44 58,54 50,48 42,54 45,44 37,38 47,38" fill="#F4C430" stroke="#FFFFFF" stroke-width="0.8" />
  
  <!-- Radiating Rays / Sunburst lines -->
  <line x1="50" y1="14" x2="50" y2="22" stroke="#FFFFFF" stroke-width="1.2" />
  <line x1="50" y1="78" x2="50" y2="86" stroke="#FFFFFF" stroke-width="1.2" />
  <line x1="14" y1="50" x2="22" y2="50" stroke="#FFFFFF" stroke-width="1.2" />
  <line x1="78" y1="50" x2="86" y2="50" stroke="#FFFFFF" stroke-width="1.2" />
  
  <line x1="25" y1="25" x2="31" y2="31" stroke="#FFFFFF" stroke-width="1" />
  <line x1="75" y1="25" x2="69" y2="31" stroke="#FFFFFF" stroke-width="1" />
  <line x1="25" y1="75" x2="31" y2="69" stroke="#FFFFFF" stroke-width="1" />
  <line x1="75" y1="75" x2="69" y2="69" stroke="#FFFFFF" stroke-width="1" />
  
  <!-- Laurel / Olive Wreath arches -->
  <path d="M 28 50 A 22 22 0 0 1 72 50" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
  <path d="M 30 58 A 20 20 0 0 0 70 58" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>

  <!-- Academic book icon at bottom center -->
  <path d="M 44 64 Q 50 62 56 64 L 56 69 Q 50 67 44 69 Z" fill="#FFFFFF" />
  <path d="M 44 64 Q 38 62 32 64 L 32 69 Q 38 67 44 69 Z" fill="#FFFFFF" />
</svg>
